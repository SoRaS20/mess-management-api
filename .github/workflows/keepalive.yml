name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}

    steps:
      - name: Ping Render backend
        shell: bash
        run: |
          if [ -z "${RENDER_BACKEND_URL}" ]; then
            echo "Missing RENDER_BACKEND_URL secret."
            echo "Add it in GitHub: Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 "${RENDER_BACKEND_URL}" >/dev/null
