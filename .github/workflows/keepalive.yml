name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
      DEFAULT_RENDER_BACKEND_URL: https://mess-management-api-wfjf.onrender.com/ready

    steps:
      - name: Ping Render backend
        shell: bash
        run: |
          url="${RENDER_BACKEND_URL:-$DEFAULT_RENDER_BACKEND_URL}"

          echo "Pinging ${url}"
          curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 "${url}" >/dev/null
